name: Vérification

# Rejoue les contrôles qualité sur chaque Pull Request, pour qu'aucune
# régression n'atteigne `main` (dont le push déclenche le déploiement).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Build et vérification de types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx astro check

      - name: Construire le site
        run: npm run build
