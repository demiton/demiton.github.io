    <path d="M180 0V600M360 0V600M540 0V600M720 0V600M900 0V600"/>
    <path d="M0 120H1080M0 240H1080M0 360H1080M0 480H1080"/>
  </g>

  <circle cx="540" cy="300" r="300" fill="url(#halo)"/>
  <circle cx="700" cy="360" r="240" fill="url(#braise)"/>

  <!-- Cadran extérieur -->
  <circle cx="540" cy="300" r="230" fill="none" stroke="#26262D" stroke-width="1.5"/>
  <circle cx="540" cy="300" r="190" fill="none" stroke="#2E2E36" stroke-width="1.5"/>
  <circle cx="540" cy="300" r="120" fill="none" stroke="#26262D" stroke-width="1.5"/>

  <!-- Graduations -->
  <g stroke="#35353D" stroke-width="2">
    <path d="M540 70V92"/>
    <path d="M655 100.8L644 120"/>
    <path d="M730 175.8L711 186.8"/>
    <path d="M759.2 300H781"/>
    <path d="M730 424.2L711 413.2"/>
    <path d="M655 499.2L644 480"/>
    <path d="M540 530V508"/>
    <path d="M425 499.2L436 480"/>
    <path d="M350 424.2L369 413.2"/>
    <path d="M320.8 300H342"/>
    <path d="M350 175.8L369 186.8"/>
    <path d="M425 100.8L436 120"/>
  </g>

  <!-- Secteur déjà applicable -->
  <path d="M350 300 A190 190 0 0 1 475 121.4" fill="none" stroke="#35D6D6" stroke-width="11" stroke-linecap="round"/>
  <circle cx="350" cy="300" r="9" fill="#35D6D6"/>
  <circle cx="475" cy="121.4" r="9" fill="#35D6D6"/>

