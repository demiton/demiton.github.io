  <circle cx="540" cy="300" r="46" fill="none" stroke="#F2F1ED" stroke-opacity="0.25" stroke-width="1.5"/>
  <path d="M540 300L540 110" stroke="#F2F1ED" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M540 300L676 434" stroke="#F5B400" stroke-opacity="0.5" stroke-width="1.5"/>
