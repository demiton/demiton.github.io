<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Cadran abstrait dont deux secteurs sont mis en évidence">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#35D6D6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#35D6D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="braise" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#E8352B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8352B" stop-opacity="0"/>
