<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Faisceaux lumineux guidés à travers une puce">
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#35D6D6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#35D6D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="guide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35D6D6"/>
      <stop offset="50%" stop-color="#6B4CE6"/>
      <stop offset="100%" stop-color="#F5B400"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="600" fill="#0B0B0E"/>
  <rect width="1080" height="600" fill="url(#halo)"/>

  <g stroke="#26262D" stroke-width="1">
    <path d="M0 150H1080M0 300H1080M0 450H1080"/>
    <path d="M180 0V600M540 0V600M900 0V600"/>
  </g>

  <!-- Boîtier -->
  <rect x="290" y="170" width="500" height="260" rx="12" fill="#101015" stroke="#35353D" stroke-width="2"/>

  <!-- Guides d'onde : entrée, maillage, sortie -->
  <g fill="none" stroke-width="3">
    <path d="M180 300H290" stroke="url(#guide)"/>
    <path d="M330 300H360" stroke="#35D6D6" stroke-opacity="0.9"/>
    <path d="M330 250H360" stroke="#6B4CE6" stroke-opacity="0.9"/>
    <path d="M330 350H360" stroke="#F5B400" stroke-opacity="0.9"/>
  </g>

  <!-- Maillage d'interféromètres -->
  <g fill="none" stroke-width="2.5" stroke-opacity="0.85">
    <path d="M400 230L470 300M400 370L470 300M470 300L540 240M470 300L540 360" stroke="#35D6D6"/>
    <path d="M400 300L470 300" stroke="#6B4CE6"/>
    <path d="M540 240L610 300M540 360L610 300M610 300L680 300" stroke="#F5B400"/>
    <path d="M470 300L540 240M470 300L540 360" stroke="#6B4CE6" stroke-opacity="0.5"/>
  </g>
  <g fill="none" stroke="#26262D" stroke-width="1.5">
    <rect x="388" y="218" width="24" height="24" rx="4"/>
    <rect x="388" y="288" width="24" height="24" rx="4"/>
    <rect x="388" y="358" width="24" height="24" rx="4"/>
  </g>

  <!-- Résonateurs en anneau -->
  <g fill="none" stroke="#6B4CE6" stroke-opacity="0.6" stroke-width="2">
    <circle cx="620" cy="240" r="16"/>
    <circle cx="620" cy="360" r="16"/>
  </g>

  <!-- Sortie -->
  <g fill="none" stroke-width="3">
    <path d="M680 300H790" stroke="#35D6D6"/>
    <path d="M790 300H900" stroke="url(#guide)"/>
  </g>

  <!-- Photodétecteurs -->
  <g fill="#E8352B">
    <circle cx="800" cy="300" r="14"/>
  </g>
  <circle cx="800" cy="300" r="26" fill="none" stroke="#E8352B" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Source -->
  <g>
    <circle cx="150" cy="300" r="18" fill="#6B4CE6" fill-opacity="0.85"/>
    <circle cx="150" cy="300" r="34" fill="none" stroke="#6B4CE6" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
</svg>
