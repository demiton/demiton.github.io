<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Trois trajectoires distinctes convergent vers un même noyau">
  <defs>
    <radialGradient id="noyau" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8352B" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#E8352B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="600" fill="#0B0B0E"/>

  <!-- Trame de fond -->
  <g stroke="#26262D" stroke-width="1">
    <path d="M180 0V600M360 0V600M540 0V600M720 0V600M900 0V600"/>
    <path d="M0 150H1080M0 300H1080M0 450H1080"/>
  </g>

  <circle cx="780" cy="300" r="310" fill="url(#noyau)"/>

  <!-- Trois trajectoires vers un même point -->
  <g fill="none" stroke-width="2.5">
    <path d="M-20 118C250 118 430 236 700 291" stroke="#35D6D6" stroke-opacity="0.75"/>
    <path d="M-20 300C270 300 470 300 700 300" stroke="#F5B400" stroke-opacity="0.75"/>
    <path d="M-20 482C250 482 430 364 700 309" stroke="#6B4CE6" stroke-opacity="0.75"/>
  </g>

  <!-- Anneaux de confinement -->
  <g fill="none" stroke="#F2F1ED" stroke-opacity="0.16" stroke-width="1.5">
    <ellipse cx="780" cy="300" rx="152" ry="152"/>
    <ellipse cx="780" cy="300" rx="108" ry="108"/>
    <ellipse cx="780" cy="300" rx="64" ry="64"/>
  </g>

  <!-- Particules portées par les trajectoires -->
  <g>
    <circle cx="236" cy="143" r="8" fill="#35D6D6"/>
    <circle cx="470" cy="234" r="6" fill="#35D6D6" fill-opacity="0.8"/>
    <circle cx="304" cy="300" r="8" fill="#F5B400"/>
    <circle cx="518" cy="300" r="6" fill="#F5B400" fill-opacity="0.8"/>
    <circle cx="236" cy="457" r="8" fill="#6B4CE6"/>
    <circle cx="470" cy="366" r="6" fill="#6B4CE6" fill-opacity="0.8"/>
  </g>

  <!-- Noyau -->
  <circle cx="780" cy="300" r="46" fill="#E8352B"/>
  <circle cx="780" cy="300" r="46" fill="none" stroke="#F2F1ED" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
