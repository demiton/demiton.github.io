<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Noyau et orbites stylisés">
  <defs>
    <radialGradient id="coeur" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B4CE6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6B4CE6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="600" fill="#0B0B0E"/>

  <!-- Trame -->
  <g stroke="#26262D" stroke-width="1">
    <path d="M0 100H1080M0 200H1080M0 300H1080M0 400H1080M0 500H1080"/>
    <path d="M100 0V600M300 0V600M500 0V600M700 0V600M900 0V600"/>
  </g>

  <circle cx="540" cy="300" r="250" fill="url(#coeur)"/>

  <!-- Orbites -->
  <g fill="none" stroke-width="1.5">
    <ellipse cx="540" cy="300" rx="330" ry="120" stroke="#35D6D6" stroke-opacity="0.55" transform="rotate(-18 540 300)"/>
    <ellipse cx="540" cy="300" rx="270" ry="98" stroke="#6B4CE6" stroke-opacity="0.65" transform="rotate(24 540 300)"/>
    <ellipse cx="540" cy="300" rx="196" ry="72" stroke="#F5B400" stroke-opacity="0.5" transform="rotate(-8 540 300)"/>
  </g>

  <!-- Noyau -->
  <circle cx="540" cy="300" r="46" fill="#E8352B"/>
  <circle cx="540" cy="300" r="46" fill="none" stroke="#F2F1ED" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="540" cy="300" r="76" fill="none" stroke="#E8352B" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Satellites -->
  <g>
    <circle cx="212" cy="392" r="11" fill="#35D6D6"/>
    <circle cx="806" cy="196" r="11" fill="#6B4CE6"/>
    <circle cx="742" cy="404" r="9" fill="#F5B400"/>
    <circle cx="352" cy="176" r="7" fill="#F2F1ED"/>
  </g>

  <!-- Éclats -->
  <g stroke="#F2F1ED" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M540 118V78M540 482V522M358 300H318M722 300H762"/>
  </g>
</svg>
