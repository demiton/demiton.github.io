<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Chaîne protéique repliée émergeant d'un semis de molécules éparses">
  <defs>
    <radialGradient id="lueur" cx="66%" cy="47%" r="55%">
      <stop offset="0%" stop-color="#6B4CE6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6B4CE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fondu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="semis" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="2.8" fill="#5C5C66"/>
    </pattern>
    <mask id="efface">
      <rect x="40" y="90" width="520" height="440" fill="url(#fondu)"/>
    </mask>
  </defs>

  <rect width="1080" height="600" fill="#0B0B0E"/>
  <rect width="1080" height="600" fill="url(#lueur)"/>

  <g stroke="#26262D" stroke-width="1">
    <path d="M0 150H1080M0 300H1080M0 450H1080"/>
    <path d="M180 0V600M540 0V600M900 0V600"/>
  </g>

  <!-- Le stock de molécules testées, qui s'estompe -->
  <rect x="40" y="90" width="520" height="440" fill="url(#semis)" mask="url(#efface)"/>

  <!-- Quelques touches dans le stock -->
  <g fill="#E8352B" fill-opacity="0.9">
    <circle cx="118" cy="192" r="6"/>
    <circle cx="212" cy="386" r="6"/>
    <circle cx="158" cy="500" r="5"/>
  </g>

  <!-- Chaîne repliée, dessinée pour la cible -->
  <path d="M300 452Q352 372 404 296Q456 350 508 404Q560 340 612 272Q664 330 716 386Q768 318 820 250Q872 296 924 344"
        fill="none" stroke="#35D6D6" stroke-opacity="0.85" stroke-width="11" stroke-linecap="round"/>

  <!-- Résidus, aux points d'ancrage de la chaîne -->
  <g fill="#F2F1ED">
    <circle cx="300" cy="452" r="9"/>
    <circle cx="404" cy="296" r="9"/>
    <circle cx="508" cy="404" r="9"/>
    <circle cx="612" cy="272" r="9"/>
    <circle cx="716" cy="386" r="9"/>
    <circle cx="820" cy="250" r="9"/>
    <circle cx="924" cy="344" r="9"/>
  </g>

  <!-- Le site de liaison mis en avant -->
  <circle cx="820" cy="250" r="24" fill="none" stroke="#E8352B" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="820" cy="250" r="14" fill="#E8352B"/>

  <!-- Liaisons faibles entre résidus éloignés -->
  <g stroke="#F5B400" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 6">
    <path d="M404 296Q600 150 820 250"/>
    <path d="M508 404Q700 520 924 344"/>
  </g>
</svg>
