<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-label="Comparaison entre une antenne relais au sol et un satellite servant de station de base">
  <rect width="1080" height="440" fill="#0B0B0E"/>
  <rect x="0.5" y="0.5" width="1079" height="439" fill="none" stroke="#26262D"/>

  <text x="40" y="56" fill="#93939C" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="18">Deux façons de couvrir un territoire</text>

  <!-- Modèle terrestre -->
  <text x="60" y="110" fill="#F2F1ED" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="20">Réseau terrestre</text>
  <g>
    <path d="M120 330V180" stroke="#35353D" stroke-width="4"/>
    <path d="M96 180h48l-10-30h-28z" fill="#35D6D6" fill-opacity="0.7"/>
    <ellipse cx="120" cy="330" rx="70" ry="16" fill="#35D6D6" fill-opacity="0.14"/>
    <ellipse cx="120" cy="330" rx="34" ry="9" fill="#35D6D6" fill-opacity="0.22"/>
  </g>
  <text x="60" y="380" fill="#93939C" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="17">Une antenne par zone :</text>
  <text x="60" y="404" fill="#93939C" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="17">la couverture se construit site par site.</text>

  <path d="M540 90V410" stroke="#26262D" stroke-width="1.5"/>

  <!-- Modèle satellitaire -->
  <text x="600" y="110" fill="#F2F1ED" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="20">Satellite station de base</text>
  <g transform="translate(760 175)">
    <rect x="-28" y="-22" width="56" height="44" rx="6" fill="#16161B" stroke="#F2F1ED" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="-80" y="-14" width="46" height="28" rx="4" fill="#6B4CE6" fill-opacity="0.75"/>
    <rect x="34" y="-14" width="46" height="28" rx="4" fill="#6B4CE6" fill-opacity="0.75"/>
  </g>
  <g stroke="#F5B400" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M712 205L620 300M808 205L628 300M760 205L624 300"/>
  </g>
  <ellipse cx="624" cy="330" rx="150" ry="24" fill="#F5B400" fill-opacity="0.14"/>
  <ellipse cx="624" cy="330" rx="78" ry="13" fill="#F5B400" fill-opacity="0.22"/>
  <text x="600" y="380" fill="#93939C" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="17">Un satellite éclaire une région entière :</text>
  <text x="600" y="404" fill="#93939C" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="17">la couverture se construit lancement par lancement.</text>
</svg>
