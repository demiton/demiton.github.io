<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-label="Comparaison des deux réactions de fusion : deutérium-tritium avec neutron et 80 % de l'énergie emportée par le neutron, hydrogène-bore avec trois noyaux d'hélium, sans neutron, mais une température d'allumage neuf fois plus élevée">
  <rect width="1080" height="480" fill="#0B0B0E"/>
  <rect x="0.5" y="0.5" width="1079" height="479" fill="none" stroke="#26262D"/>

  <text x="40" y="50" fill="#93939C" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="18">Deux réactions, deux problèmes de matériaux</text>

  <!-- ================= Panneau A : deutérium-tritium ================= -->
  <rect x="40" y="74" width="470" height="360" rx="10" fill="#16161B" stroke="#35D6D6" stroke-width="1.5"/>
  <text x="64" y="112" fill="#F2F1ED" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="20">Deutérium-tritium</text>
  <text x="64" y="136" fill="#93939C" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="15">la voie d'ITER et de BEST</text>

  <g font-family="Barlow, ui-sans-serif, system-ui, sans-serif">
    <text x="64" y="166" fill="#93939C" font-size="13">RÉACTION</text>
    <text x="64" y="188" fill="#F2F1ED" font-size="17">D + T → hélium-4 + neutron</text>

    <text x="64" y="222" fill="#93939C" font-size="13">PARTAGE DE L'ÉNERGIE</text>
    <text x="64" y="244" fill="#F2F1ED" font-size="17">20 % à l'hélium · 80 % au neutron</text>

    <text x="64" y="278" fill="#93939C" font-size="13">NEUTRONS</text>
    <text x="64" y="300" fill="#F2F1ED" font-size="17">oui, l'essentiel de l'énergie</text>

    <text x="64" y="334" fill="#93939C" font-size="13">CONSÉQUENCE MATÉRIAUX</text>
    <text x="64" y="356" fill="#F2F1ED" font-size="17">paroi activée · tritium à régénérer</text>

    <text x="64" y="390" fill="#93939C" font-size="13">SEUIL D'ALLUMAGE</text>
    <text x="64" y="412" fill="#35D6D6" font-size="17">≈ 13,6 keV  (~1,4 × 10⁸ K)</text>
  </g>

  <!-- ================= Panneau B : hydrogène-bore ================= -->
  <rect x="570" y="74" width="470" height="360" rx="10" fill="#16161B" stroke="#6B4CE6" stroke-width="1.5"/>
  <text x="594" y="112" fill="#F2F1ED" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="20">Hydrogène-bore</text>
  <text x="594" y="136" fill="#93939C" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="15">la voie revendiquée par ENN</text>

  <g font-family="Barlow, ui-sans-serif, system-ui, sans-serif">
    <text x="594" y="166" fill="#93939C" font-size="13">RÉACTION</text>
    <text x="594" y="188" fill="#F2F1ED" font-size="17">p + ¹¹B → 3 hélium-4</text>

    <text x="594" y="222" fill="#93939C" font-size="13">PARTAGE DE L'ÉNERGIE</text>
    <text x="594" y="244" fill="#F2F1ED" font-size="17">8,7 MeV, portés par 3 héliums</text>

    <text x="594" y="278" fill="#93939C" font-size="13">NEUTRONS</text>
    <text x="594" y="300" fill="#F2F1ED" font-size="17">aucun dans la voie principale</text>

    <text x="594" y="334" fill="#93939C" font-size="13">CONSÉQUENCE MATÉRIAUX</text>
    <text x="594" y="356" fill="#F2F1ED" font-size="17">pas d'activation · pas de tritium</text>

    <text x="594" y="390" fill="#93939C" font-size="13">SEUIL D'ALLUMAGE</text>
    <text x="594" y="412" fill="#6B4CE6" font-size="17">≈ 123 keV  (~1,2 × 10⁹ K)</text>
  </g>

  <text x="40" y="460" fill="#93939C" font-family="Barlow, ui-sans-serif, system-ui, sans-serif" font-size="15">Le bore porte cinq protons : barrière coulombienne plus haute, seuil d'allumage neuf fois supérieur.</text>
</svg>
